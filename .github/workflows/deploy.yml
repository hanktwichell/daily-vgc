name: Deploy to GitHub Pages

# Builds the site and publishes it to the `gh-pages` branch, which GitHub Pages serves.
# (GitHub enables Pages for a repository automatically when a `gh-pages` branch appears.
# If it doesn't, set Settings → Pages → Source to "Deploy from a branch", branch `gh-pages`, folder `/`.)

on:
  push:
    branches: [main]
  # Pushes made by the calibration workflow do not trigger `push`, so redeploy after it runs.
  workflow_run:
    workflows: ["Calibrate upcoming puzzles"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate-teams -- --strict
      - run: npm run build
        env:
          # Public address used in share text and link previews. Defaults to the GitHub Pages URL;
          # set a repository variable SITE_URL (e.g. daily-vgc.com) when using a custom domain.
          VITE_SITE_URL: ${{ vars.SITE_URL || format('{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
