name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pushes made by the calibration workflow do not trigger `push`, so redeploy after it runs.
  workflow_run:
    workflows: ["Calibrate upcoming puzzles"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate-teams -- --strict
      - run: npm run build
        env:
          # Optional: set a repository variable SITE_URL (e.g. daily-vgc.com) to control the share link.
          VITE_SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
