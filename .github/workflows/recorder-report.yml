# Prints a summary of what the community stats recorder has collected so far, including the
# current day's puzzle (which the public /stats endpoint hides until the day is over).
# Run it from the Actions tab. Only anonymous aggregates and outcomes are printed.
name: Recorder report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Battles per puzzle and mode
        run: |
          npx wrangler d1 execute dailyvgc --remote --json --command "
            SELECT puzzle, mode, COUNT(*) AS battles, SUM(won) AS wins,
              SUM(CASE WHEN won = 1 AND alive = 4 THEN 1 ELSE 0 END) AS perfect,
              SUM(CASE WHEN won = 1 AND alive = 3 THEN 1 ELSE 0 END) AS three_left,
              SUM(CASE WHEN won = 1 AND alive = 2 THEN 1 ELSE 0 END) AS two_left,
              SUM(CASE WHEN won = 1 AND alive = 1 THEN 1 ELSE 0 END) AS one_left,
              ROUND(AVG(turns), 1) AS avg_turns,
              datetime(MIN(created_at) / 1000, 'unixepoch') AS first_utc,
              datetime(MAX(created_at) / 1000, 'unixepoch') AS last_utc
            FROM results GROUP BY puzzle, mode ORDER BY puzzle, mode"
      - name: Fours brought (pick order ignored by the site; shown as sent)
        run: |
          npx wrangler d1 execute dailyvgc --remote --json --command "
            SELECT puzzle, mode, picks, won, alive, turns, team, version,
              datetime(created_at / 1000, 'unixepoch') AS at_utc
            FROM results ORDER BY id DESC LIMIT 50"
