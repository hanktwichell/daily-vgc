name: Calibrate upcoming puzzles

# Once a week, simulate the next three weeks of puzzles and pin the best-balanced player
# teams in src/data/calibrated.json. Today's and past puzzles are never changed.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulate upcoming puzzles
        run: npm run calibrate -- --upcoming 21
      - name: Commit results
        run: |
          if git diff --quiet src/data/calibrated.json; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/calibrated.json
          git commit -m "Calibrate upcoming Daily VGC puzzles"
          git push
